# Mô phỏng chi phí khi dùng thật — Radar pre-class cho giảng viên / lab coach / ban đào tạo.
# Chạy: python run.py simulate --try (10 phiên) · python run.py simulate (đủ 50 phiên — bản nộp CP4)
# Người dùng là ĐỘI DẠY, không phải học viên → quy mô nhỏ (vài chục người / khoá).

